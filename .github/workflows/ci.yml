# 持續整合：型別檢查、lint、測試、建置。平台部署另外在 Vercel 執行 npm run build。
# Continuous integration: typecheck, lint, tests, build. The platform deploy runs npm run build on Vercel separately.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小權限：CI 只需要讀取程式碼。
# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# 同一個分支有新的推送時，取消尚未跑完的舊執行。
# A newer push to the same ref cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # 格式與正式相依套件的已知高風險漏洞；放行的公告與理由在 scripts/audit-allowlist.mjs。
      # Formatting, and known high-severity vulnerabilities in production dependencies; allowed
      # advisories and their reasons live in scripts/audit-allowlist.mjs.
      - run: npm run format:check
      - run: node scripts/audit-gate.mjs
      - run: npm test
      # 建置會接著跑 db:migrate；沒有 DATABASE_URL 時 migrate 腳本會略過。
      # build chains db:migrate; without DATABASE_URL the migrate script skips.
      - run: npm run build

  # 渲染、版面、儲存、網址狀態與 CSP 端點要真的瀏覽器才測得到；對正式建置跑。
  # Rendering, layout, storage, URL state and the CSP endpoint need a real browser; run against the production build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run preview:restart
      - run: npm run test:e2e
      # CPU 降速 10 倍再跑一次：在水合完成前就操作的測試，在這裡每次都會失敗，不會只是偶爾失敗。
      # Again with the CPU slowed tenfold: a test that acts before hydration finishes fails here
      # every time instead of now and then.
      - run: npm run test:e2e:throttled
      - run: npm run build:pages
      - run: npm run test:pages
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            screenshots/
            .grok/preview.log
